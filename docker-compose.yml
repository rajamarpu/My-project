version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: uptoskills_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uptoskills
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: uptoskills_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/uptoskills?schema=public
      JWT_SECRET: uptoskills-jwt-secret-production-change-me
      API_BASE_URL: http://localhost:5000
      APP_BASE_URL: http://localhost:5173
      CLIENT_ORIGINS: http://localhost:5173
      API_PORT: 5000
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./
      dockerfile: Dockerfile.frontend
      args:
        VITE_PORT: 5173
    container_name: uptoskills_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_PORT: 5173
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend

volumes:
  postgres_data:
