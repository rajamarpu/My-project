services:
  mongo:
    image: mongo:7
    container_name: celebrity-academy-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: celebrity-academy-api
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    environment:
      API_PORT: 5000
      CLIENT_ORIGIN: http://localhost:5174
      MONGODB_URI: mongodb://mongo:27017/celebrity_academy
      JWT_SECRET: replace-this-with-a-long-random-secret
    restart: unless-stopped

volumes:
  mongo-data:
