<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
        color: #fff;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .page {
        text-align: center;
        max-width: 520px;
        padding: 32px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        box-shadow: 0 32px 80px rgba(15, 23, 42, 0.2);
        backdrop-filter: blur(12px);
      }
      h1 {
        margin: 0 0 16px;
        font-size: 2.4rem;
      }
      p {
        margin: 0 0 24px;
        line-height: 1.7;
        color: #e2e8f0;
      }
      a {
        color: #ffffff;
        text-decoration: none;
        font-weight: 700;
        background: rgba(255, 255, 255, 0.16);
        padding: 12px 24px;
        border-radius: 999px;
      }
      a:hover {
        background: rgba(255, 255, 255, 0.24);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>Welcome!</h1>
      <p>You have successfully logged in. This is the destination page after the login redirect.</p>
      <a href="/">Return to Login</a>
    </div>
  </body>
</html>
